[package]
name = "meerkat-tui"
description = "Interactive terminal coding harness for Meerkat with an auto-mode approval model"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
keywords.workspace = true
categories.workspace = true

[[bin]]
name = "rkat-tui"
path = "src/main.rs"

[dependencies]
# Meerkat engine (feature-gated: no comms, no mob, no semantic memory)
meerkat = { workspace = true, features = ["anthropic", "openai", "gemini", "jsonl-store", "memory-store", "session-store", "session-compaction", "skills"] }
meerkat-core = { workspace = true }
meerkat-client = { workspace = true }
meerkat-store = { workspace = true }
meerkat-session = { workspace = true }
meerkat-hooks = { workspace = true }
meerkat-tools = { workspace = true }
meerkat-models = { workspace = true }

# Async + serialization
tokio = { workspace = true }
futures = { workspace = true }
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
schemars = { workspace = true }

# Infra
clap = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
dirs = { workspace = true }
indexmap = { workspace = true }
parking_lot = { workspace = true }

# Terminal UI
ratatui = { version = "0.30", default-features = false, features = ["crossterm"] }
crossterm = { version = "0.29", features = ["event-stream"] }
pulldown-cmark = { version = "0.13", default-features = false }
unicode-width = "0.2"

# File tools and path policy
ignore = "0.4"
globset = "0.4"
regex = "1"
similar = "2"

[features]
default = ["mcp", "sub-agents"]
mcp = ["meerkat/mcp"]
sub-agents = ["meerkat/sub-agents"]

[dev-dependencies]
tokio = { workspace = true, features = ["test-util", "macros"] }
tempfile = { workspace = true }

[lints]
workspace = true
